# CI monorepo: build hanya app yang berubah.
#
# Path filter adalah inti dari "update sebagian saja dengan cepat":
#   - sentuh apps/bmachine/**    -> hanya BMachine yang di-build
#   - sentuh apps/pixacompact/** -> hanya PixaCompact yang di-build
#   - sentuh shared/**           -> keduanya (shared dipakai dua app)
#   - sentuh docs/WORKSPACES.md  -> tidak ada build (docs only)
#
# Setiap job build: restore (cache NuGet) -> build Release -> publish ->
# upload artifact (tab Actions). Rilis tetap lewat ProjectBot (WORKSPACES.md
# bagian 5); CI ini memastikan setiap push tidak merusak build.

name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- deteksi app mana yang perlu di-built ----------
  # Pakai git diff bawaan: tidak ada dependency action pihak ketiga yang bisa
  # mendadak break karena perubahan tag.
  changes:
    name: Deteksi perubahan
    runs-on: windows-latest
    outputs:
      bmachine: ${{ steps.f.outputs.bmachine }}
      pixacompact: ${{ steps.f.outputs.pixacompact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cek file yang berubah
        id: f
        shell: pwsh
        run: |
          $prev = '${{ github.event.before }}'
          if (-not $prev -or $prev -eq '0000000000000000000000000000000000000000') {
            # Force push / branch baru: anggap semua app perlu dibangun.
            $diff = @('apps/bmachine/a', 'apps/pixacompact/a', 'shared/a')
          } else {
            $diff = git -c core.pager=cat diff --name-only $prev $env:GITHUB_SHA
          }
          Write-Host "Changed files:"
          $diff | ForEach-Object { Write-Host "  $_" }
          $bm = ($diff -join "`n" -match '^apps/bmachine/')
          $px = ($diff -join "`n" -match '^apps/pixacompact/')
          $sh = ($diff -join "`n" -match '^shared/')
          if ($sh) { $bm = $true; $px = $true }
          "bmachine=$($bm -or $false)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pixacompact=$($px -or $false)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  # ---------- BMachine ----------
  build-bmachine:
    name: Build BMachine
    needs: changes
    if: needs.changes.outputs.bmachine == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-bmachine-${{ hashFiles('apps/bmachine/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-bmachine-

      - name: Build
        run: dotnet build apps/bmachine/src/BMachine.App/BMachine.App.csproj -c Release --nologo

      - name: Publish (single-file, win-x64)
        run: dotnet publish apps/bmachine/src/BMachine.App/BMachine.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/bmachine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMachine-${{ github.sha }}
          path: publish/bmachine
          retention-days: 14

  # ---------- PixaCompact ----------
  build-pixacompact:
    name: Build PixaCompact
    needs: changes
    if: needs.changes.outputs.pixacompact == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-pixa-${{ hashFiles('apps/pixacompact/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-pixa-

      - name: Build
        run: dotnet build apps/pixacompact/PixelcutCompact.csproj -c Release --nologo

      # Publish PixaCompact ~2.2 GB (Playwright + ONNX). Artifact hanya untuk
      # branch utama; PR tidak perlu menyalin binary raksasa itu.
      - name: Publish (single-file, win-x64)
        if: github.ref == 'refs/heads/main'
        run: dotnet publish apps/pixacompact/PixelcutCompact.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/pixacompact

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PixaCompact-${{ github.sha }}
          path: publish/pixacompact
          retention-days: 7
