[package]
name = "bmachine-slint-demo"
version = "0.1.1"
edition = "2024"

[dependencies]
slint = { version = "1", features = ["std", "backend-winit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
rdev = "0.5.3"

[build-dependencies]
slint-build = "1"
