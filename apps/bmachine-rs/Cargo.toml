[package]
name = "bmachine-slint-demo"
version = "0.1.1"
edition = "2024"

[dependencies]
slint = { version = "1", features = ["std", "backend-winit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
# JWT RS256 service account Google Sheets (Fase 6): ring = tanda tangan
# RSA PKCS#1 v1.5 + SHA-256, base64 = base64url + decode PEM.
ring = "0.17"
base64 = "0.22"
# Decode spritesheet PetDex (WebP/PNG) — decode_sheet di petdex.rs.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
rdev = "0.5.3"
chrono = "0.4"
# Process group sendiri untuk Stop BATCH (setsid di batch_exec.rs).
libc = "0.2"

# Deteksi window foreground untuk Auto-hide Dynamic Island
# (src/fullscreen.rs) — Linux saja; Windows pakai FFI user32
# mentah (tanpa crate baru, windows-sys tidak ada di cache offline).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[build-dependencies]
slint-build = "1"
