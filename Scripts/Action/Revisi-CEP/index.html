<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="CSInterface.js"></script>
</head>
<body>
    <div class="header">
        <span class="title">Revisi (Advance)</span>
        <div class="header-actions">
            <button id="btnImport" class="icon-btn" title="Import Data">📥</button>
            <button id="btnExport" class="icon-btn" title="Export Data">📤</button>
        </div>
    </div>
    
    <div class="toolbar">
        <button id="btnNewGroup" class="icon-btn" title="Buat Set Baru">📁 Set Baru</button>
        <button id="btnNewAction" class="icon-btn" title="Buat Action Baru">➕ Action Baru</button>
    </div>

    <!-- Container Utama -->
    <div id="actionsContainer" class="actions-container">
        <!-- JS Render Here -->
    </div>

    <!-- Panel Pengaturan Action yang sedang aktif -->
    <div id="actionSettings" class="action-settings" style="display: none;">
        <div class="settings-header">
            <span id="settingsTitle">Pengaturan Action</span>
            <button id="btnCloseSettings" class="btn-small">✖</button>
        </div>
        
        <div class="settings-body">
            <label>Mode Eksekusi:</label>
            <select id="selActionType" class="input-modern">
                <option value="ps_action">Opsi 1: Looping PS Action</option>
                <option value="text_replace">Opsi 2: Sapu Bersih (Ganti Teks)</option>
            </select>
            
            <!-- Form untuk PS Action (Opsi 1) -->
            <div id="formPsAction" class="form-group">
                <label>Nama Set (di Panel Action PS):</label>
                <input type="text" id="inpPsSet" class="input-modern" placeholder="Cth: Default Actions">
                
                <label>Nama Action:</label>
                <input type="text" id="inpPsAction" class="input-modern" placeholder="Cth: Vignette (selection)">
            </div>
            
            <!-- Form untuk Text Replace (Opsi 2) -->
            <div id="formTextReplace" class="form-group" style="display: none;">
                <label>Nama Layer Target (Cth: Redaksi Sekolah):</label>
                <input type="text" id="inpTargetLayer" class="input-modern" placeholder="Nama layer persis...">
                
                <label>Teks Pengganti:</label>
                <textarea id="inpNewText" class="input-modern" rows="3" placeholder="Masukkan teks baru di sini..."></textarea>
            </div>
            
            <div class="settings-footer">
                <button id="btnPlaySingle" class="btn" title="Jalankan di Layer Aktif Saja">▶️ Play (Single)</button>
                <button id="btnPlayBatch" class="btn btn-primary" title="Terapkan ke SEMUA Artboard">⏭️ BATCH PLAY</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
