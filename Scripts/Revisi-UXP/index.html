<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <span class="title">Revisi</span>
        <div class="header-actions">
            <button id="btnImport" class="icon-btn" title="Import Actions">📥</button>
            <button id="btnExport" class="icon-btn" title="Export Actions">📤</button>
        </div>
    </div>
    
    <div class="toolbar">
        <button id="btnRecord" class="btn" title="Record (Start)">🔴</button>
        <button id="btnStop" class="btn" title="Stop Recording">⏹</button>
        <button id="btnPlaySingle" class="btn" title="Play on Current">▶️</button>
        <button id="btnPlayBatch" class="btn btn-primary" title="Play to All Artboards">⏭️ Batch</button>
    </div>
    
    <div class="toolbar">
        <button id="btnNewGroup" class="icon-btn" title="New Group">📁 Group</button>
        <button id="btnNewAction" class="icon-btn" title="New Action">➕ Action</button>
    </div>

    <div id="actionsContainer" class="actions-container">
        <!-- Groups and Actions rendered via JS -->
    </div>

    <script src="index.js"></script>
</body>
</html>
